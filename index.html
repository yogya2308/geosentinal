<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GeoSentinel - AI Mine Subsidence Early Warning System (SIH26025)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800;900&family=Roboto+Condensed:wght@400;700;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />
    <script>
      // Automatically normalize trailing slash for GitHub Pages project subpath
      if (!window.location.pathname.endsWith('/') && !window.location.pathname.split('/').pop().includes('.')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = '<main style="min-height:100vh;background:#090f1f;color:#f8fafc;font:16px system-ui;padding:32px"><h1>GeoSentinel could not start</h1><p>' + (event.message || 'Reload the page or open the latest deployment URL.') + '</p></main>';
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = '<main style="min-height:100vh;background:#090f1f;color:#f8fafc;font:16px system-ui;padding:32px"><h1>GeoSentinel could not start</h1><p>' + (event.reason?.message || String(event.reason) || 'Reload the page or open the latest deployment URL.') + '</p></main>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
